@let cat = shop.tab() === 'cat';
<app-page-head title="Корпоративный магазин"><app-shop-head [list]="true" /></app-page-head>
<div class="c mb cmtabc">
  <div class="ctabs">
    <div class="stab" [class.on]="cat" (click)="shop.tab.set('cat')">Каталог<span class="pntc">{{ nProducts }}</span></div>
    <div class="stab" [class.on]="!cat" (click)="shop.tab.set('ord')">История заказов<span class="pntc">{{ shop.orders().length }}</span></div>
  </div>
  @if (cat) {
    <app-filter-bar placeholder="Поиск по товарам" [(query)]="f.q" [(opened)]="f.catOpen">
      <button ftAction app-sort-button [options]="sorts" [(value)]="f.sort"></button>
      <app-chips label="Категория" [options]="cats" [(value)]="f.cat" />
      <button class="fchip shtg" [class.on]="f.stock()" (click)="f.stock.set(!f.stock())">В наличии</button>
      <app-filter-input label="Цена от" digits [max]="7" inputClass="shpr" [(value)]="f.pmin" />
      <app-filter-input label="Цена до" digits [max]="7" inputClass="shpr" [(value)]="f.pmax" />
    </app-filter-bar>
  } @else {
    <app-filter-bar placeholder="Поиск по номеру заказа" [(query)]="f.oq" [(opened)]="f.ordOpen">
      <button ftAction app-table-settings [columns]="orderCols" [(hidden)]="f.hidden"></button>
      <app-chips label="Статус заказа" [options]="statuses" [(value)]="f.ost" />
      <app-date-field placeholder="Дата создания" [value]="f.od()" (valueChange)="setOd($event)" />
      <app-filter-input label="Количество" digits [max]="3" [group]="false" inputClass="shpr" [(value)]="f.on" />
      <app-filter-input label="Сумма" digits [max]="7" inputClass="shpr" [(value)]="f.os" />
    </app-filter-bar>
  }
</div>
@if (cat) {
  <div class="shp" shop-grid></div>
} @else {
  <div class="shp" shop-orders></div>
}
