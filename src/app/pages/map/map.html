@let D = s.mode() === 'desk';
<app-page-head title="Бронирование" />
<div class="c bkc">
  <div class="ctabs">
    <span [class.on]="D" (click)="s.mode.set('desk')">Рабочие места</span>
    <span [class.on]="!D" (click)="s.mode.set('room')">Переговорные</span>
  </div>
  <app-filter-bar [placeholder]="D ? 'Номер места или коллега' : 'Номер или название переговорной'" [(query)]="s.q" [(opened)]="filtersOpen">
    <div ftAction class="seg bkvw">
      <span title="Карта" aria-label="Карта" [class.on]="s.view() === 'map'" (click)="s.view.set('map')">
        <svg viewBox="0 0 16 16" fill="none"><path d="M1.8 3.6 5.6 2l4.8 1.6L14.2 2v10.4l-3.8 1.6-4.8-1.6-3.8 1.6V3.6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" /><path d="M5.6 2v10.4M10.4 3.6V14" stroke="currentColor" stroke-width="1.4" /></svg>
      </span>
      <span title="Список" aria-label="Список" [class.on]="s.view() === 'list'" (click)="s.view.set('list')">
        <svg viewBox="0 0 16 16" fill="none"><path d="M5.6 4h8.2M5.6 8h8.2M5.6 12h8.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" /><circle cx="2.6" cy="4" r="1" fill="currentColor" /><circle cx="2.6" cy="8" r="1" fill="currentColor" /><circle cx="2.6" cy="12" r="1" fill="currentColor" /></svg>
      </span>
    </div>
    <button ftAction class="btn pri" (click)="book()">{{ D ? 'Забронировать место' : 'Забронировать переговорную' }}</button>
    <div class="seg bkfl" ftName="Этаж">
      <em>Этаж</em>
      @for (f of floors; track f) {
        <span [class.on]="s.floor() === f" (click)="s.floor.set(f)">{{ f }}</span>
      }
    </div>
    <app-select label="Город" [options]="cities" [value]="s.city()" (valueChange)="s.setCity($event)" />
    <app-select label="Офис" [options]="s.offices()" [(value)]="s.office" />
    <div class="bkdt" ftName="Дата"><app-date-field [value]="s.date()" (valueChange)="setDate($event)" /></div>
    @if (D) {
      <app-multi-select label="Оснащение места" [options]="feats" [(value)]="s.feat" />
    } @else {
      <app-select ftName="Вместимость" [options]="caps" [value]="capLabel()" (valueChange)="setCap($event)" />
      <app-multi-select label="Оборудование" [options]="eqs" [(value)]="s.eq" />
    }
    <button class="lnk" [class.hidden]="!s.filtered()" (click)="s.resetFilters()">Сбросить фильтры</button>
  </app-filter-bar>
  <div>
    @if (s.view() === 'map') {
      <div map-canvas></div>
    } @else if (D) {
      <div map-desks></div>
    } @else {
      <div map-rooms></div>
    }
  </div>
</div>
<app-map-pop />
